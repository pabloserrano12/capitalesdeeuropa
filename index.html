<title>Europa: países y capitales</title>

<style>
:root{color-scheme:dark;--sea:#cfe6f3;--bg:#0a2038;--panel:#102c4b;--line:#25557f;--txt:#eef6fc;--mut:#9ec1de;--acc:#ffd23f;--ok:#2fcf7f;--bad:#ff5d5d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px;max-width:1280px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar b{font-size:1.05rem}.hud{color:var(--mut);font-size:.95rem}
button,select{font:inherit;color:var(--txt);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{border-color:var(--acc);color:var(--acc)}
#prompt{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;overflow:hidden}
#sub{color:var(--mut);font-size:.9rem}
#big{font-size:clamp(1.7rem,5vw,2.7rem);font-weight:700;color:var(--acc);line-height:1.1}
#msg{min-height:1.3em;font-size:1rem}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
#pb{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0;transition:width .4s}
#stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);border:2px solid var(--line);touch-action:none}
svg{width:100%;height:100%;display:block;cursor:crosshair;user-select:none;-webkit-user-select:none}
#ctx path{fill:#dcdad2;stroke:#c9c6bb;stroke-width:.6}
.c{stroke:#fff;stroke-width:1;stroke-linejoin:round;transition:fill .2s}
.m{stroke-width:1.4;stroke:#17324f}
.play .c:hover{filter:brightness(1.12)}
.c.ok{fill:#2fcf7f!important}.c.bad{fill:#ff5d5d!important}.c.rev{fill:#ffd23f!important}
.nm{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;fill:#12283f;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
.ld{stroke:#12283f;stroke-width:.8;pointer-events:none}
.cp{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;fill:#12283f;paint-order:stroke;stroke:#fff;stroke-width:3.2px;pointer-events:none}
.ring{fill:none;stroke:#ff9f1c;stroke-width:3;pointer-events:none;animation:p 1s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.ring{animation:none}}
.side{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.side button{width:40px;height:40px;padding:0;font-size:1.3rem}
.ov{position:absolute;inset:0;background:rgba(8,28,50,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;overflow:auto;z-index:5}
.ov h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem)}
.lv{display:grid;gap:10px;width:min(540px,100%)}
.lv button{text-align:left;padding:12px 16px}
.lv b{display:block;font-size:1.15rem;color:var(--acc)}.lv span{color:var(--mut);font-size:.92rem}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.st{display:grid;gap:10px;width:min(460px,100%);text-align:left}
.st label{display:grid;gap:4px;color:var(--mut)}.st select{width:100%}
.hide{display:none!important}
</style></head><body>

if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
const say=t=>{if(!voiceOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/-/g,' '));u.lang='es-ES';const v=voices.find(v=>v.name===vname);if(v){u.voice=v;u.lang=v.lang}u.rate=rate;u.pitch=pit;speechSynthesis.speak(u)};
let ac;function tone(f,t,d,ty='sine',g=.12){if(!soundOn)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime+t;o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(v).connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const sOk=()=>{tone(660,0,.12);tone(880,.1,.2)},sBad=()=>tone(170,0,.25,'sawtooth',.07);
$('vsel').onchange=e=>{vname=e.target.value;st.set('eu_voice',vname)};
$('vrate').value=rate;$('vpit').value=pit;
$('vrate').oninput=e=>{rate=+e.target.value;st.set('eu_rate',rate)};$('vpit').oninput=e=>{pit=+e.target.value;st.set('eu_pit',pit)};
$('vtest').onclick=()=>say('Haz clic en la capital: Lisboa');
$('vson').textContent='Efectos: '+(soundOn?'sí':'no');$('vson').onclick=()=>{soundOn=!soundOn;st.set('eu_snd',soundOn?'1':'0');$('vson').textContent='Efectos: '+(soundOn?'sí':'no');sOk()};
$('vok').onclick=()=>$('ov2').classList.add('hide');$('cfg').onclick=()=>{loadVoices();$('ov2').classList.remove('hide')};
// ---- game
const msg=(t,c='')=>{$('msg').textContent=t;$('msg').className=c};
const clear=()=>{svg.querySelectorAll('.c').forEach(e=>e.classList.remove('ok','bad','rev'));$('caps').innerHTML=''};
const mark=(i,c)=>svg.querySelectorAll(`.c[data-i="${i}"]`).forEach(e=>e.classList.add(c));
function cap(j,col){const d=D[j];el('circle',{cx:d.dot[0],cy:d.dot[1],r:5,fill:col,stroke:'#12283f','stroke-width':1.6},$('caps'));el('text',{class:'cp','font-size':12,x:d.dot[0]+8,y:d.dot[1]+4},$('caps')).textContent=d.cap}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const best=()=>+st.get(`eu_b${level}_${N}`)||0;
function start(l){level=l;score=0;streak=0;miss=[];qi=0;t0=Date.now();
 Q=shuffle(D.map((_,i)=>i)).slice(0,Math.min(N,D.length)).map(i=>({i,t:l===1?'c':l===2?'k':(Math.random()<.5?'c':'k')}));
 Q.forEach(o=>{if(o.t==='k'&&D[o.i].n==='Ciudad del Vaticano')o.t='c'});
 $('ov').classList.add('hide');$('names').classList.toggle('hide',l!==2);svg.classList.add('play');
 $('ttl').textContent=['','Nivel 1 · Encuentra el país','Nivel 2 · Coloca la capital','Nivel 3 · Países y capitales'][l];
 go(VB0,300);next()}
function next(){clear();locked=false;tries=0;hinted=false;if(qi>=Q.length)return finish();q=Q[qi];const d=D[q.i];
 $('hud').textContent=`Pregunta ${qi+1}/${Q.length} · Puntos ${score}`;$('stk').textContent=streak>1?`Racha ×${streak}`:'';$('pb').style.width=(qi/Q.length*100)+'%';
 if(q.t==='c'){$('sub').textContent='Haz clic en el país';$('big').textContent=d.n;say('Haz clic en el país: '+d.n)}
 else{$('sub').textContent='Haz clic en el país de esta capital';$('big').textContent=d.cap;say('¿En qué país está la capital: '+d.cap+'?')}
 msg('')}
function hint(){if(!q||locked)return;hinted=true;const d=D[q.i],c=q.t==='c'?d.lab:d.dot;if(q.t==='c'&&MICRO.has(d.n))c[0]=d.dot[0],c[1]=d.dot[1];
 const r=el('circle',{class:'ring',cx:c[0],cy:c[1],r:q.t==='c'?Math.max(26,Math.min(70,d.w/2)):42},$('caps'));setTimeout(()=>r.remove(),2600);msg('Pista: busca dentro del círculo.');say('Pista')}
function reveal(){locked=true;const d=D[q.i];if(q.t==='c'){mark(q.i,'rev');go(focus(d.lab,q.i),350)}else{cap(q.i,'#ffd23f');go(focus(d.dot),350)}
 miss.push(q.t==='c'?d.n:`${d.cap} (${d.n})`);streak=0;msg(`Era ${q.t==='c'?d.n:d.cap}.`,'bad');say('Era '+(q.t==='c'?d.n:d.cap));qi++;setTimeout(next,2600)}
function focus(c,i){const w=Math.max(vb.w,520),t={x:c[0]-w/2,y:c[1]-w*800/1100/2,w,h:w*800/1100};t.x=Math.min(Math.max(t.x,-60),1160-w);t.y=Math.min(Math.max(t.y,-60),860-t.h);return vb.w>=1099?VB0:t}
function ok(){locked=true;const d=D[q.i];if(q.t==='c')mark(q.i,'ok');else cap(q.i,'#2fcf7f');
 if(!tries&&!hinted){score++;streak++}else{streak=0;miss.push((q.t==='c'?d.n:d.cap)+' (con ayuda)')}
 $('hud').textContent=`Pregunta ${qi+1}/${Q.length} · Puntos ${score}`;$('stk').textContent=streak>1?`Racha ×${streak}`:'';msg('¡Correcto!','ok');sOk();say('¡Correcto!');qi++;setTimeout(next,1200)}
function wrong(text,said,i){tries++;streak=0;msg(text,'bad');sBad();say(said);if(i>=0){mark(i,'bad');setTimeout(()=>{if(!locked)svg.querySelectorAll(`.c[data-i="${i}"]`).forEach(e=>e.classList.remove('bad'))},650)}
 if(tries>=2)setTimeout(reveal,1300)}
function pickCap(p,R=22){let b=-1,bd=(R*vb.w/1100)**2;D.forEach((d,i)=>{if(d.n!=='Ciudad del Vaticano'){const e=(d.dot[0]-p.x)**2+(d.dot[1]-p.y)**2;if(e<bd){bd=e;b=i}}});return b}
function onClick(e){if(locked||!q||!level)return;const p=P(e);
 if(q.t==='c'){const n=document.elementFromPoint(e.clientX,e.clientY),t=n&&n.closest?n.closest('[data-i]'):null;if(!t){msg('Ahí no hay ningún país. Prueba dentro de uno.');return}
  const i=+t.dataset.i;if(i===q.i)ok();else wrong(`No, eso es ${D[i].n}. Prueba otra vez.`,`No, eso es ${D[i].n}`,i)}
 else{const n=document.elementFromPoint(e.clientX,e.clientY),t=n&&n.closest?n.closest('[data-i]'):null;if(!t){msg('Ahí no hay ningún país. Prueba dentro de uno.');return}
  const i=+t.dataset.i;if(i===q.i)ok();else wrong(`No, ${D[q.i].cap} no está en ${D[i].n}. Prueba otra vez.`,`No, ${D[q.i].cap} no está en ${D[i].n}`,i)}}
function finish(){q=null;$('pb').style.width='100%';const s=Math.round((Date.now()-t0)/1000),b=best(),nb=score>b;if(nb)st.set(`eu_b${level}_${N}`,score);
 $('ov').classList.remove('hide');$('ov').innerHTML=`<h1>${score} de ${Q.length}</h1><div class="hud">A la primera y sin pistas · ${Math.floor(s/60)} min ${s%60} s${nb?' · ¡Nuevo récord!':b?' · Récord: '+b:''}</div><div class="hud" style="max-width:520px">${miss.length?'Para repasar: '+miss.join(', ')+'.':'¡Ronda perfecta!'}</div><div class="lv"><button id="a1">Repetir este nivel</button><button id="a2">Elegir otro nivel</button></div>`;
 $('a1').onclick=()=>start(level);$('a2').onclick=home;say(`Has conseguido ${score} de ${Q.length}.`)}
function home(){q=null;level=0;svg.classList.remove('play');$('names').classList.add('hide');clear();go(VB0,300);['hud','big','sub','stk'].forEach(k=>$(k).textContent='');msg('');$('pb').style.width='0';$('ttl').textContent='Europa: países y capitales';
 const e=$('ov');e.classList.remove('hide');const B=l=>st.get(`eu_b${l}_${N}`);
 e.innerHTML=`<h1>¿Cuánto sabes de Europa?</h1><div class="lv"><button data-l="1"><b>Nivel 1 · Encuentra el país</b><span>Mapa vacío. Te digo un país y haces clic sobre él.${B(1)?' Récord: '+B(1)+'.':''}</span></button><button data-l="2"><b>Nivel 2 · Coloca la capital</b><span>Los países llevan su nombre. Haz clic donde está la capital.${B(2)?' Récord: '+B(2)+'.':''}</span></button><button data-l="3"><b>Nivel 3 · Países y capitales</b><span>Mapa vacío. Países y capitales mezclados.${B(3)?' Récord: '+B(3)+'.':''}</span></button></div><div class="row"><span class="hud">Preguntas por ronda:</span>${[10,20,45].map(n=>`<button class="${n===N?'on':''}" data-n="${n}">${n===45?'Todas':n}</button>`).join('')}</div><div class="hud">Dos intentos por pregunta · la voz lee cada pregunta · arrastra para mover el mapa</div>`;
 e.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l));e.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{N=+b.dataset.n;st.set('eu_n',N);home()})}
// ---- input
const P=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
let pd=null;
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);pd={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,m:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(!pd.m&&Math.hypot(dx,dy)<6)return;pd.m=true;const r=svg.getBoundingClientRect(),k=Math.max(vb.w/r.width,vb.h/r.height);vb.x=pd.vx-dx*k;vb.y=pd.vy-dy*k;clamp();setVB()});
svg.addEventListener('pointerup',e=>{if(pd&&!pd.m)onClick(e);pd=null});
svg.addEventListener('wheel',e=>{e.preventDefault();const p=P(e);zoom(e.deltaY<0?.8:1.25,p.x,p.y)},{passive:false});
$('zi').onclick=()=>zoom(.65);$('zo').onclick=()=>zoom(1.5);$('zr').onclick=()=>go(VB0,300);
$('hint').onclick=hint;$('menu').onclick=home;
$('rep').onclick=()=>{if(q)say(q.t==='c'?'Haz clic en el país: '+D[q.i].n:'¿En qué país está la capital: '+D[q.i].cap+'?')};
home();
</script></body></html>
